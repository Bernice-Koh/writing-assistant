[package]
name = "writing-assistant"
version = "0.1.0"
description = "Windows writing assistant for spelling, grammar, and target-voice style"
authors = ["Bernice Koh"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Bernice-Koh/writing-assistant"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.62"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
env_logger = "0.11"
