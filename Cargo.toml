[workspace]
members = ["crates/engine", "crates/wa", "src-tauri"]
resolver = "2"

[workspace.package]
rust-version = "1.88"
edition = "2021"
license = "MIT"
authors = ["Bernice Koh"]

[workspace.dependencies]
wa-engine = { path = "crates/engine" }
windows = "0.62"
log = "0.4"
env_logger = "0.11"
tokio = "1"
serde = { version = "1", features = ["derive"] }
