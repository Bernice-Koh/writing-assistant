[package]
name = "wa-engine"
version = "0.1.0"
description = "The checking engine behind the writing-assistant app and the wa command line"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/Bernice-Koh/writing-assistant"

[lib]
name = "wa_engine"

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
thiserror = "2"
log.workspace = true
async-trait = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time", "process", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde.workspace = true
serde_json = "1"
spellbook = "0.4"
unicode-segmentation = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
regex = "1"
similar = "2"
lru = "0.12"
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
env_logger.workspace = true
tokio = { workspace = true, features = ["test-util"] }
